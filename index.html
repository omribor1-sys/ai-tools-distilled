const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('s').addEventListener('change', ev => { document.getElementById('p').type = ev.target.checked ? 'text' : 'password'; });
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  // Spaces and invisible direction marks (pasted text, RTL keyboards, autofill) are never part of
  // the password - strip them, or a correct password fails with no visible reason.
  const pw = document.getElementById('p').value.replace(/[\s\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, ''), e = document.getElementById('e');
  if (!window.crypto || !crypto.subtle) { e.textContent = '❌ הדפדפן הזה לא יכול לפענח. פתח את הקישור ב-Chrome או ב-Safari רגיל'; return; }
  e.textContent = 'מפענח…';
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
    const html = new TextDecoder().decode(plain);
    try { sessionStorage.setItem('aitd_ok','1'); } catch(_){}
    document.open(); document.write(html); document.close();
  } catch (err) {
    e.textContent = '❌ סיסמה שגויה (הוקלדו ' + pw.length + ' תווים)';
